show:
  name: <show name>
  genre_register: co_trang_tien_hiep
device: auto
video:
  sample_fps: 4
  subtitle_band:
    top: 0.8272
    bottom: 0.8959
    left: 0.1943
    right: 0.798
  text_threshold: 200
  change_threshold: 0.02
  empty_text_ratio: 0.002
  subtitle_detection: outline
  outline_dark_threshold: 60
  outline_reach_px: 2
  min_outlined_ratio: 0.006
  band_frames: 5
ocr:
  min_confidence: 0.6
  merge_max_edit_distance: 1
  fragment_max_samples: 1
  fragment_merge_similarity: 0.6
  preprocess: segment
  recognize: line
  mask_image: original
  mask_scale: 1.0
non_dialogue:
  enabled: true
  box_height_tolerance: 0.25
  box_center_tolerance: 0.15
  max_duration_ms: 8000
ocr_fix:
  batch_size: 50
  max_char_changes: 2
audio:
  sample_rate: 16000
  pad_ms: 100
  min_event_ms: 400
voice:
  model: speechbrain/spkrec-ecapa-voxceleb
  top_k: 3
  accept_score: 0.6
  min_margin: 0.08
  unknown_below: 0.35
  confusable_similarity: 0.75
  learn_from_reviews: true
  learn_min_ms: 800
  learn_trim_ms: 80
  learn_min_clips: 3
  learn_outlier_share: 0.1
  learn_from_auto: true
  learn_auto_min_score: 0.7
  learn_auto_min_margin: 0.15
  learn_auto_allowed_flags:
  - cps_exceeded
  - check_pinyin
  learn_auto_min_test_lines: 30
  learn_auto_max_drop: 0.0
  new_voices: true
  new_voice_below: 0.7
  new_voice_similarity: 0.6
  new_voice_known_max: 0.65
  new_voice_min_lines: 3
  new_voice_prefix: npc
cast:
  enabled: true
  detector_model: google/owlv2-base-patch16-ensemble
  embed_model: facebook/dinov2-base
  queries:
  - a cartoon character
  - a cartoon person
  - a cartoon fish
  - a dog
  frame_width: 960
  sample_fps: 5
  min_score: 0.15
  min_box_height: 0.12
  min_box_width: 0.05
  max_box_width: 0.9
  nms_iou: 0.5
  match_similarity: 0.7
  match_margin: 0.03
  unknown_similarity: 0.75
  motion_fps: 10
  motion_width: 480
  talk_dominance: 1.6
  learn: true
  name_min_votes: 3
  name_min_share: 0.75
  add_similarity: 0.85
  max_exemplars: 60
pinyin:
  polyphone_fallback: true
  polyphones:
  - 了
  - 行
  - 长
  - 得
  - 还
  - 重
  - 为
  - 着
  - 地
  - 的
  - 觉
  - 都
  - 处
  - 传
  - 藏
windows:
  gap_ms: 3000
  max_lines: 40
  context_overlap: 5
translate:
  max_retries: 2
  max_line_chars: 42
  max_lines_per_event: 2
  max_cps: 17
  retry_on_cps: false
  picture_veto: 'off'
  picture_evidence: tiebreak
  pronoun_terms:
  - ta
  - ngươi
  - huynh
  - đệ
  - tỷ
  - muội
  - sư phụ
  - đồ nhi
  - sư huynh
  - sư đệ
  - sư tỷ
  - sư muội
  - tại hạ
  - bổn tọa
  - lão phu
  - bản cung
  - trẫm
  - thần
  - nô tỳ
  - các hạ
  - tiền bối
  - vãn bối
  - tôi
  - bạn
  - anh
  - em
  - chị
  - cậu
  - tớ
  - mày
  - tao
evaluate:
  min_score: 3
  criteria:
  - meaning
  - pronouns
  - register
  - naturalness
  - speaker
sprite:
  enabled: false
  match_threshold: 0.8
  scales:
  - 0.6
  - 0.8
  - 1.0
  - 1.2
  trigger_conf_below: 0.6
script_review:
  enabled: true
  role: utility
  repeat_merge_gap_ms: 300
  repeat_window_ms: 4000
  repeat_similarity: 0.6
  remove_confidence: 0.9
  max_remove_share: 0.1
  example_limit: 30
  memory_auto_remove_min: 2
  memory_max_han: 2
review:
  mode: human
  predelete_fragments: true
  noise_max_han: 2
audit:
  sample_size: 20
  min_per_stratum: 3
  max_disagreements: 15
  include_human: false
  ignore_flags:
  - cps_exceeded
  - check_pinyin
memory:
  correction_examples: 20
  character_lifecycle: true
  archive_after_absent: 2
  probation: true
  probation_min_lines: 3
  probation_window: 2
  story_so_far_max_words: 600
  style_rules_max: 30
  dream_max_lines: 400
render:
  font_dir: fonts
  font_name: Noto Sans
  pinyin_font_size: 36.0
  vi_font_size: 48.0
  pinyin_min_scale: 0.7
  line_spacing: 1.2
  avg_char_width: 0.55
  outline: 2.5
  shadow: 0
  primary_color: '&H00FFFFFF'
  outline_color: '&H00000000'
  mask: blur
  blur_radius: 20
  mask_color: black
  encoder: auto
  quality: 20
llm:
  temperature: 0
  max_retries: 5
  timeout_s: 120
  max_retry_wait_s: 90
  providers:
    translator:
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-chat
    utility:
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-chat
    evaluator:
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      api_key_env: GEMINI_API_KEY
      model: gemini-3.1-flash-lite
  prices:
    deepseek-chat:
      input: 0.3
      input_cached: 0.006
      output: 1.2
    gemini-3.1-flash-lite:
      input: 0
      input_cached: 0
      output: 0
    gemini-3.5-flash-lite:
      input: 0
      input_cached: 0
      output: 0
budget:
  max_cost_per_episode: 1.0
paths:
  work_dir: E:/Video Data/Raw
episodes:
  video_extensions:
  - .mp4
  - .mkv
  - .avi
  - .mov
  - .flv
  - .webm
  - .ts
  number_patterns:
  - 第\s*(\d+)\s*[集话話]
  - (?i)\bep(?:isode)?[\s._-]*(\d+)
  - (?i)\be(\d{1,4})\b
  - (\d{1,4})
output:
  folder: E:/Video Data/Translated
  name_suffix: _vi
  on_exists: ask
cleanup:
  auto: true

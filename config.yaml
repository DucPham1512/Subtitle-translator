device: auto
ocr_fix:
  batch_size: 50
  max_char_changes: 2
audio:
  sample_rate: 16000
  pad_ms: 100
  min_event_ms: 400
pinyin:
  polyphone_fallback: true
  polyphones:
  - 了
  - 行
  - 长
  - 得
  - 还
  - 重
  - 为
  - 着
  - 地
  - 的
  - 觉
  - 都
  - 处
  - 传
  - 藏
windows:
  gap_ms: 3000
  max_lines: 40
  context_overlap: 5
translate:
  max_retries: 2
  max_line_chars: 42
  max_lines_per_event: 2
  max_cps: 17
  retry_on_cps: false
  picture_veto: 'off'
  picture_evidence: tiebreak
  pronoun_terms: []        # empty: the style's words (prompts/registers/<show.genre_register>.md)
evaluate:
  min_score: 3
  criteria:
  - meaning
  - pronouns
  - register
  - naturalness
  - speaker
sprite:
  enabled: false
  match_threshold: 0.8
  scales:
  - 0.6
  - 0.8
  - 1.0
  - 1.2
  trigger_conf_below: 0.6
review:
  mode: human
  predelete_fragments: true
  noise_max_han: 2
audit:
  sample_size: 20
  min_per_stratum: 3
  max_disagreements: 15
  include_human: false
  ignore_flags:
  - cps_exceeded
  - check_pinyin
memory:
  correction_examples: 20
  character_lifecycle: true
  archive_after_absent: 2
  probation: true
  probation_min_lines: 3
  probation_window: 2
  character_updates: false         # 2026-10-10: off: chain bench showed no speaker / pronoun gain; kept for human mode (vault)
  description_max_chars: 200
  aliases_max: 8
  story_so_far_max_words: 600
  style_rules_max: 30
  dream_max_lines: 400
render:
  font_dir: fonts
  font_name: Noto Sans
  pinyin_font_size: 36.0
  vi_font_size: 48.0
  pinyin_min_scale: 0.7
  line_spacing: 1.2
  avg_char_width: 0.55
  outline: 2.5
  shadow: 0
  primary_color: '&H00FFFFFF'
  outline_color: '&H00000000'
  mask: blur
  blur_radius: 20
  mask_color: black
  encoder: auto
  quality: 20
llm:
  temperature: 0
  max_retries: 5
  timeout_s: 120
  max_retry_wait_s: 90
  providers:
    translator:
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-chat
    utility:
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-chat
    evaluator:
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      api_key_env: GEMINI_API_KEY
      model: gemini-3.1-flash-lite
  prices:
    deepseek-chat:
      input: 0.3
      input_cached: 0.006
      output: 1.2
    gemini-3.1-flash-lite:
      input: 0
      input_cached: 0
      output: 0
    gemini-3.5-flash-lite:
      input: 0
      input_cached: 0
      output: 0
budget:
  max_cost_per_episode: 1.0
episodes:
  video_extensions:
  - .mp4
  - .mkv
  - .avi
  - .mov
  - .flv
  - .webm
  - .ts
  number_patterns:
  - 第\s*(\d+)\s*[集话話]
  - (?i)\bep(?:isode)?[\s._-]*(\d+)
  - (?i)\be(\d{1,4})\b
  - (\d{1,4})
output:
  folder: E:/Video Data/Translated
  name_suffix: _vi
  on_exists: ask
cleanup:
  auto: true
series:
  default: series-1    # the series the app and the CLI use
